<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cat Photo Gallery</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>My Cat Photo Gallery</h1>

    <p class="instructions">
        Hover over an image or use the Tab key to explore the gallery.
    </p>

    <div id="image">
        <img id="featured-image"
             src="cat1.jpg"
             alt="A cat in the first gallery photo">

        <p id="image-info">
            Choose a photo to see its information.
        </p>
    </div>

    <div class="gallery">

        <img src="cat1.jpeg" alt="A cat relaxing and looking at the camera">

        <img src="cat2.jpeg" alt="A curious cat looking around">

        <img src="cat3.jpeg" alt="A cute cat sitting comfortably">

        <img src="cat4.jpeg" alt="A playful cat enjoying its surroundings">

        <img src="cat5.jpg" alt="A cat resting peacefully">

        <img src="cat6.jpg" alt="A fluffy cat posing for a photo">

    </div>

</body>
</html>
